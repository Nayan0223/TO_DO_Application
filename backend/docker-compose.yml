services:
  postgres:
    image: postgres:17
    container_name: todo-postgres
    environment:
      POSTGRES_DB: todo_app
      POSTGRES_USER: todo_dev
      POSTGRES_PASSWORD: todo_dev_password
    ports:
      - "5432:5432"
    volumes:
      - todo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo_dev -d todo_app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  todo-postgres-data:
